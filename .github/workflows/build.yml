name: Build fonts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build fonts
        run: make build

      - name: Run tests
        run: make test

      - name: Render previews
        run: make preview

      - name: Upload fonts
        uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: fonts/*.ttf

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: docs/preview-*.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fonts
          path: fonts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: fonts/*.ttf
          generate_release_notes: true
